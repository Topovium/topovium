# SPDX-License-Identifier: GPL-3.0-or-later
name: Mobile

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Cross-compile the core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a build -p topovium-ffi

  ios:
    name: iOS (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2

      # No signing and no simulator run: this proves the core cross-compiles, which is
      # the thing that silently breaks. Device testing happens in the nightly lab.
      - name: Cross-compile the core
        run: cargo build -p topovium-ffi --target aarch64-apple-ios
