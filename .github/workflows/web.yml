name: Web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: topovium.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A type error must fail the build. AGENTS.md section 3.
      - name: Typecheck
        run: pnpm --filter topovium-web typecheck

      # `any` is an error, not a warning. Next 16 no longer runs ESLint during
      # `next build`, so it runs here as its own gate.
      - name: Lint
        run: pnpm --filter topovium-web lint

      - name: Build
        run: pnpm --filter topovium-web build

  wasm:
    name: WebAssembly core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The browser is a first-class target, so the core must keep compiling for it.
      # Catching a wasm break here is far cheaper than at the end of a milestone.
      - name: Build core for wasm32
        run: cargo build -p topovium-viewport -p topovium-foundation -p topovium-revisions --target wasm32-unknown-unknown
