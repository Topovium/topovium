name: Secrets

on:
  push:
  pull_request:

# This repository is public. A credential pushed here is compromised within seconds --
# scrapers index public pushes continuously. See AGENTS.md section 2.
#
# The gitleaks release binary is used directly rather than gitleaks/gitleaks-action,
# which requires a paid licence for organisation-owned repositories. The binary itself is
# MIT-licensed and free; only the Action wrapper is commercial. Running it directly also
# drops the wrapper's bundled Node runtime and its deprecation warnings.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans full history. A non-zero exit means a secret was found, which fails the job.
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
