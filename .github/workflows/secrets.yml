# SPDX-License-Identifier: GPL-3.0-or-later
name: Secrets

on:
  push:
  pull_request:

# This repository is public. A credential pushed here is compromised within seconds --
# scrapers index public pushes continuously. See AGENTS.md section 2.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip

      # Deliberately NOT gitleaks/gitleaks-action.
      #
      # Both v2 and v3 of that action require a GITLEAKS_LICENSE secret when the
      # repository belongs to an organisation, and Topovium is an organisation. The key
      # is free but needs a signup, an email round trip, and a stored secret, and the
      # job fails outright until someone does all three -- which means secret scanning
      # fails open, on the one check that must never fail open.
      #
      # The gitleaks binary itself is MIT-licensed and needs none of that. Installing
      # the release directly also drops the action's bundled Node 20 runtime and its
      # deprecation warnings.
      #
      # If you are about to switch this back to the action: read issue #59 first.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans full history. A non-zero exit means a secret was found, which fails the job.
      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
