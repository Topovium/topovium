name: Secrets

on:
  push:
  pull_request:

# This repository is public. A credential pushed here is compromised within seconds --
# scrapers index public pushes continuously. See AGENTS.md section 2.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
